<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить язык — шаг 1</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="add-scroll">
            <h1>Добавить язык</h1>

            <div class="form-section-title">Медиа</div>

            <div class="form-group">
                <label>Ссылка на изображение</label>
                <input type="text" name="image_url" form="addForm"
                       value="{{ .defaultImage }}"
                       placeholder="/static/img/default-language.jpg">
            </div>

            <div class="form-group">
                <label>Ссылка на видео</label>
                <input type="text" name="video_url" form="addForm"
                       value="{{ .defaultVideo }}"
                       placeholder="/static/video/default-language.mp4">
            </div>

            <div class="form-section-title">Основное</div>

            <form id="addForm" action="/languages/new" method="POST">
                <div class="form-group">
                    <label>Название языка</label>
                    <input type="text" name="title" placeholder="Введите название" required>
                </div>
                <button type="submit" class="form-btn">Далее</button>
            </form>
        </div>

        <nav class="bottom-nav">
            <a href="/languages" class="nav-item">Лента</a>
            <a href="/languages/new" class="nav-item active">Добавление</a>
            <a href="/languages/catalog" class="nav-item">Плитка</a>
        </nav>
    </div>
</body>
</html>
