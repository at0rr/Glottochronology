<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все языки</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="grid-scroll">
            <h1>Все языки</h1>

            <!-- Фильтр-выпадашка по годам -->
            <form action="/languages/catalog" method="GET" class="filter-form">
                <input type="date" name="date" class="date-input" value="{{ .filter }}">
                <button type="submit">Показать</button>
            </form>

            <div class="grid">
                {{ range .cards }}
                <div class="card-wrapper">
                    <a href="/languages?id={{ .ID }}" class="card">
                        <img src="{{ .ImageURL }}" alt="{{ .Title }}">
                        <div class="card-body">
                            <h3>{{ .Title }} язык</h3>
                            <p>Дата: {{ .DateStr }}</p>
                            <span class="card-likes">{{ .Likes }} ❤️</span>
                        </div>
                    </a>
                    <form action="/languages/delete" method="POST" class="delete-form">
                        <input type="hidden" name="id" value="{{ .ID }}">
                        <button type="submit" class="delete-btn">Удалить</button>
                    </form>
                </div>
                {{ end }}
            </div>
        </div>
        <nav class="bottom-nav">
            <a href="/languages" class="nav-item">Лента</a>
            <a href="/languages/new" class="nav-item">Добавление</a>
            <a href="/languages/catalog" class="nav-item active">Плитка</a>
        </nav>
    </div>
</body>
</html>
