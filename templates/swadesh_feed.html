<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента — {{ .service.Title }}</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="feed-screen">
            <video src="{{ .videoURL }}" autoplay muted loop playsinline></video>

            <div class="feed-side">
                <div class="feed-likes">
                    <span class="feed-likes-count">{{ .likes }}</span>
                    <span class="feed-likes-heart">❤️</span>
                </div>
                <div class="feed-params">
                    <div class="feed-param">
                        <span class="feed-param-value">{{ .service.MatchPercent }}%</span>
                        <span class="feed-param-label">совпадений</span>
                    </div>
                    <div class="feed-param">
                        <span class="feed-param-value">{{ .dateStr }}</span>
                        <span class="feed-param-label">расхождение</span>
                    </div>
                </div>
            </div>

            <div class="feed-overlay">
                <h2>{{ .service.Title }} язык</h2>
                <details class="feed-details">
                    <summary class="feed-summary">
                        <span class="feed-desc-short">{{ .service.Description }}</span>
                        <span class="feed-more-label">Еще</span>
                    </summary>
                    <div class="feed-expanded">
                        <p class="feed-desc-full">{{ .service.Description }}</p>
                    </div>
                </details>
            </div>

            <a href="/swadesh-lists?id={{ .service.ID }}&next=true" class="feed-next-btn">→</a>
        </div>

        <nav class="bottom-nav bottom-nav-overlay">
            <a href="/swadesh-lists" class="nav-item active">Лента</a>
            <a href="/swadesh-lists/new" class="nav-item">Добавление</a>
            <a href="/swadesh-lists/catalog" class="nav-item">Плитка</a>
        </nav>
    </div>
</body>
</html>
