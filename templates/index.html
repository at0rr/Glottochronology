<html lang="en">
<head>
    <title>Глоттохронология</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <!-- Хедер с картинкой-ссылкой на главную -->
    <header>
        <a href="/hello">
            <img src="/static/img/logo.png" alt="Логотип" width="50" height="50">
        </a>
    </header>

    <h1>Список языков</h1>
    <form action="/hello" method="GET">
        <input type="text" name="query" placeholder="Поиск языка..." value="{{ .query }}">
        <button type="submit">Найти</button>
    </form>
    <p>Время: {{ .time }}</p>
    <ul>
        {{ range .languages }}
        <li><a href="/language/{{ .ID }}">{{ .Title }}</a></li>
        {{ end }}
    </ul>
</body>
</html>
