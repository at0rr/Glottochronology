<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="add-scroll">
            <h1>Добавить язык</h1>

            {{ if not .hasDraft }}
            <!-- Нет черновика — форма создания -->
            <form action="/add" method="POST">
                <div class="form-section-title">Медиа</div>

                <div class="form-group">
                    <label>Ссылка на изображение</label>
                    <input type="url" name="image_url"
                           placeholder="http://localhost:9000/glotto/image.png">
                </div>

                <div class="form-group">
                    <label>Ссылка на видео</label>
                    <input type="url" name="video_url"
                           placeholder="http://localhost:9000/glotto/video.mp4">
                </div>

                <div class="form-section-title">Основное</div>

                <div class="form-group">
                    <label>Название языка</label>
                    <input type="text" name="title" placeholder="Введите название" required>
                </div>

                <button type="submit" class="form-btn">Далее</button>
            </form>
            {{ else }}
            <!-- Есть черновик — форма публикации -->
            <form action="/publish" method="POST">
                <input type="hidden" name="id" value="{{ .service.ID }}">

                <div class="form-section-title">Медиа</div>

                <div class="form-group">
                    <label>Ссылка на изображение</label>
                    <input type="url" name="image_url"
                           value="{{ .service.ImageURL }}"
                           placeholder="http://localhost:9000/glotto/image.png">
                </div>

                <div class="form-group">
                    <label>Ссылка на видео</label>
                    <input type="url" name="video_url"
                           value="{{ .service.VideoURL }}"
                           placeholder="http://localhost:9000/glotto/video.mp4">
                </div>

                <div class="form-section-title">Основное</div>

                <div class="form-group">
                    <label>Название языка</label>
                    <input type="text" name="title" value="{{ .service.Title }}" required>
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <input type="text" name="description" value="{{ .service.Description }}">
                </div>

                <div class="form-section-title">Данные по глоттохронологии</div>

                <div class="form-group">
                    <label>Характерное число (% совпадений)</label>
                    <input type="number" name="match_percent" value="{{ .service.MatchPercent }}">
                </div>

                <div class="form-group">
                    <label>Дата расхождения</label>
                    <input type="date" name="divergence_date" value="2024-01-01">
                </div>

                <button type="submit" class="form-btn">Опубликовать</button>
            </form>
            {{ end }}
        </div>

        <nav class="bottom-nav">
            <a href="/feed" class="nav-item">Лента</a>
            <a href="/add" class="nav-item active">Добавление</a>
            <a href="/grid" class="nav-item">Плитка</a>
        </nav>
    </div>
</body>
</html>
