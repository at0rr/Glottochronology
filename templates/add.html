<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="add-scroll">
            <h1>Добавить язык</h1>

            <div class="form-group">
                <label>Фото</label>
                <img src="{{ .imageURL }}" alt="{{ .service.Title }}" class="preview">
            </div>

            <div class="form-group">
                <label>Видео</label>
                <video src="{{ .videoURL }}" controls class="preview"></video>
            </div>

            <div class="form-group">
                <label>Название языка</label>
                <input type="text" value="{{ .service.Title }}" readonly>
            </div>

            <div class="form-group">
                <label>Описание</label>
                <input type="text" value="{{ .service.Description }}" readonly>
            </div>

            <div class="form-group">
                <label>Характерное число</label>
                <input type="text" value="{{ .service.MatchPercent }}%" readonly>
            </div>

            <div class="form-group">
                <label>Дата расхождения</label>
                <input type="text" value="{{ .dateStr }}" readonly>
            </div>
        </div>
        <nav class="bottom-nav">
            <a href="/feed" class="nav-item">Лента</a>
            <a href="/add" class="nav-item active">Добавление</a>
            <a href="/grid" class="nav-item">Плитка</a>
        </nav>
    </div>
</body>
</html>
