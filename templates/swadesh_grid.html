<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все языки</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="mobile-frame">
        <div class="grid-scroll">
            <h1>Все языки</h1>

            <!-- Календарь-фильтр по времени -->
            <div class="filter-calendar">
                <div class="filter-tabs">
                    <a href="/swadesh-lists/catalog?mode=year&value={{ .value }}"
                       class="filter-tab {{ if eq .mode "year" }}active{{ end }}">Год</a>
                    <a href="/swadesh-lists/catalog?mode=decade&value={{ .value }}"
                       class="filter-tab {{ if eq .mode "decade" }}active{{ end }}">Десятилетие</a>
                    <a href="/swadesh-lists/catalog?mode=century&value={{ .value }}"
                       class="filter-tab {{ if eq .mode "century" }}active{{ end }}">Столетие</a>
                </div>

                <div class="filter-nav">
                    <a href="/swadesh-lists/catalog?mode={{ .mode }}&value={{ .prevValue }}" class="filter-arrow">←</a>
                    <span class="filter-label">{{ .label }}</span>
                    <a href="/swadesh-lists/catalog?mode={{ .mode }}&value={{ .nextValue }}" class="filter-arrow">→</a>
                </div>

                {{ if .hasFilter }}
                <a href="/swadesh-lists/catalog" class="filter-reset">Показать все</a>
                {{ end }}
            </div>

            <div class="grid">
                {{ range .cards }}
                <div class="card-wrapper">
                    <a href="/swadesh-lists?id={{ .ID }}" class="card">
                        <img src="{{ .ImageURL }}" alt="{{ .Title }}">
                        <div class="card-body">
                            <h3>{{ .Title }} язык</h3>
                            <p>Дата: {{ .DateStr }}</p>
                            <span class="card-likes">{{ .Likes }} ❤️</span>
                        </div>
                    </a>
                    <form action="/swadesh-lists/delete" method="POST" class="delete-form">
                        <input type="hidden" name="id" value="{{ .ID }}">
                        <button type="submit" class="delete-btn" title="Удалить">🗑</button>
                    </form>
                </div>
                {{ end }}
            </div>
        </div>
        <nav class="bottom-nav">
            <a href="/swadesh-lists" class="nav-item">Лента</a>
            <a href="/swadesh-lists/new" class="nav-item">Добавление</a>
            <a href="/swadesh-lists/catalog" class="nav-item active">Плитка</a>
        </nav>
    </div>
</body>
</html>
